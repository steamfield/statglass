name: Release

# A pushed vMAJOR.MINOR.PATCH tag builds, signs, notarizes and uploads a draft release
# (D-131). Publishing the draft stays a manual step after the downloaded DMG has been
# opened on a clean account; see .github/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate release version and manifest
        run: |
          rustup show active-toolchain
          python3 scripts/release-manifest.py "$RELEASE_TAG"
          python3 scripts/test-release-manifest.py

  # The static Linux agents the app bundles (D-116). Built here so the macOS job does
  # not need zig; versions match ZIG_VERSION and CARGO_ZIGBUILD_VERSION in the Makefile.
  agents:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Install cargo-zigbuild
        run: |
          pipx install cargo-zigbuild==0.23.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-agents
      - name: Build Linux agents
        run: make agent-linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-agents
          path: src-tauri/binaries/agent/statglass-agent-*
          retention-days: 1
          if-no-files-found: error

  # Standard macOS runners are free on this public repository (D-131). The signing
  # secrets live in the `release` environment, which only v* tags can use and which
  # waits for the maintainer's approval before this job starts.
  macos:
    needs: agents
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      APPLE_SIGNING_IDENTITY: "Developer ID Application: Riley Hilliard (YWA9Q642YP)"
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-agents
          path: src-tauri/binaries/agent
      - run: chmod +x src-tauri/binaries/agent/statglass-agent-*

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      # After setup-bun so real node outranks ~/.bun/bin in PATH.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-macos-${{ hashFiles('bun.lock') }}
          restore-keys: bun-macos-
      - run: bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos

      # A throwaway keychain holds the Developer ID identity for this job only, so both
      # tauri build and notarize-dmg.sh can sign with it; it is deleted at the end.
      - name: Import signing identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$KEYCHAIN" >/dev/null
          read -r -a keychains <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" "${keychains[@]}"
          identities="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          [[ "$identities" == *"$APPLE_SIGNING_IDENTITY"* ]] || { echo "$identities"; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"

      # Signs the app, helper and CLI with the Developer ID under the hardened runtime,
      # notarizes and staples the app, then builds the DMG and the signed updater archive.
      - name: Build, sign and notarize the app
        env:
          STATGLASS_AGENTS_PREBUILT: "1"
        run: bun run build:app --config src-tauri/tauri.release.conf.json --bundles app,dmg

      - name: Notarize and staple the DMG
        run: scripts/notarize-dmg.sh

      - name: Check runtime dependencies
        run: |
          app=target/release/bundle/macos/StatGlass.app/Contents/MacOS
          scripts/check-deps.sh "$app/statglass" "$app/statglass-remote-helper" "$app/statglass-cli"

      - name: Stage, sign and verify release assets
        run: |
          version="${RELEASE_TAG#v}"
          python3 scripts/release-manifest.py "$RELEASE_TAG" --stage
          bun run tauri signer sign --app-version "$version" target/release-assets/statglass-release.json
          python3 scripts/release-manifest.py "$RELEASE_TAG" --checksums
          cargo run --release -p statglass --example verify_release -- target/release-assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" target/release-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "StatGlass $RELEASE_TAG" --notes-file RELEASE_NOTES.md

      - name: Remove signing material
        if: always()
        run: |
          [[ -z "${KEYCHAIN:-}" ]] || security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "${APPLE_API_KEY_PATH:-}"
