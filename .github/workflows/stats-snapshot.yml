name: Stats snapshot

# Once a day, record GitHub's running download and traffic totals in PostHog so
# adoption can be charted over time. The app itself sends no telemetry; see
# scripts/github-stats-snapshot.py for what is sent.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats-snapshot
  cancel-in-progress: false

# Linux only (D-118).
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Send snapshot to PostHog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
          # Optional: fine-grained token with repository Administration (read),
          # which GitHub requires for clone and view counts.
          TRAFFIC_TOKEN: ${{ secrets.STATS_TRAFFIC_TOKEN }}
        run: python3 scripts/github-stats-snapshot.py
