[workspace]
members = ["crates/*", "src-tauri"]
exclude = ["vendor/tauri-plugin-updater"]
resolver = "3"

[workspace.package]
version = "0.16.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Workspace crates. Edges between them follow the direction table in
# plan/architecture.md; adding one not listed there is a design change.
statglass-schema = { path = "crates/statglass-schema" }
statglass-proto = { path = "crates/statglass-proto" }
statglass-collect = { path = "crates/statglass-collect" }
statglass-store = { path = "crates/statglass-store" }
statglass-engine = { path = "crates/statglass-engine" }
statglass-remote = { path = "crates/statglass-remote" }
statglass-update = { path = "crates/statglass-update" }
statglass-query = { path = "crates/statglass-query" }
statglass-notify = { path = "crates/statglass-notify" }
statglass-mobile = { path = "crates/statglass-mobile" }
statglass-session = { path = "crates/statglass-session" }
statglass-ssh = { path = "crates/statglass-ssh" }
statglass-ipc = { path = "crates/statglass-ipc" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
jiff = "0.2.37"
ciborium = "0.2.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = "1.53.3"
uuid = "1.27.0"
smallvec = "1.16.2"
compact_str = "0.10.0"
thiserror = "2.0.21"
tracing = "0.1.44"
anyhow = "1.0.104"
rustix = { version = "1.1.5", features = ["fs"] }
# The statglass CLI's argument parser (statglass-cli only). No color or suggestion
# features: the CLI renders its own did-you-mean and never styles agent output.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# Test temp dirs only (dev-dependency). The version already in Cargo.lock.
tempfile = "3.27.0"

# tauri-specta 2.x is still a release candidate (D-031). Exact pins: an RC
# bump can change the API or the generated output.
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
specta-serde = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

# The iPhone app's Swift bindings (statglass-mobile). Exact pin: the generated Swift
# and the scaffolding the proc macros emit must come from the same release. No default
# features, so the iOS library carries no cargo-metadata reader.
uniffi = { version = "=0.32.2", default-features = false }

# The phone's SSH client (statglass-ssh). Exact pin: the client `Signer` trait the
# Secure Enclave adapter implements changes shape between releases (RFC 4.2). ring is
# the crypto backend: it builds for iOS and Linux with only a C compiler (aws-lc-rs
# needs CMake) and is already in the tree through rustls. No RSA, DSA or compression:
# the phone's keys are P-256 only.
russh = { version = "=0.65.4", default-features = false, features = ["ring"] }

# The pairing QR (D-151): SVG on the Mac's sheet, Unicode blocks on the agent's terminal.
# Exact pin and no default features, so no image codec enters the tree.
qrcode = { version = "=0.15.0", default-features = false, features = ["svg"] }

[workspace.lints.clippy]
# Denied in non-test code; clippy.toml allows it in tests.
unwrap_used = "deny"
# Native expectations document the existing backlog and fail once obsolete.
too_many_lines = "warn"

[patch.crates-io]
# Automatic updates must fail with an actionable status instead of opening an
# administrator prompt. The pinned patch only adds an elevation policy.
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The iPhone app's static library (scripts/mobile/build-rust-ios.sh). Release, except
# that a panic unwinds: statglass-mobile catches it at the FFI boundary and returns an
# internal error, which `panic = "abort"` would turn into a crash.
[profile.mobile-release]
inherits = "release"
panic = "unwind"
