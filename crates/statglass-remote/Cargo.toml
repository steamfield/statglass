[package]
name = "statglass-remote"
description = "Direct SSH remote monitoring transport and app-hosted sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jiff.workspace = true
statglass-engine.workspace = true
statglass-proto.workspace = true
statglass-schema.workspace = true
statglass-session.workspace = true
statglass-store.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "net", "io-util", "io-std", "fs", "process", "macros"] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
libc = "0.2.190"
# `DeviceTag::from_key`: the first bytes of the SHA-256 of a device key.
sha2 = "0.10.9"
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "std"] }

[dev-dependencies]
statglass-session = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
