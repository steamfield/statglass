[package]
name = "statglass-ssh"
description = "In-process SSH dialer (russh) for the iPhone app, with a pluggable key signer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `SoftwareSigner`, a P-256 key held in memory, for tests and the Docker harness. The
# phone signs with the Secure Enclave (or its Swift-side simulator key) instead.
software-signer = []

[dependencies]
statglass-session.workspace = true
russh.workspace = true
# The versions russh 0.65.4 resolves, pinned with it so the signer's key and signature
# types match the ones russh accepts. `std` brings getrandom for `SoftwareSigner`.
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
sha2 = "=0.11.1"
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "io-util", "macros"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
statglass-session = { workspace = true, features = ["conformance"] }
statglass-schema.workspace = true
statglass-proto.workspace = true
statglass-engine.workspace = true
statglass-store.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
